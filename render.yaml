services:
  - type: web
    name: lufzai-form-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: APP_TOKEN
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
